services:
  - type: web
    name: ripptopia-api-staging
    runtime: node
    plan: free
    region: singapore
    rootDir: Backend
    buildCommand: npm ci --include=dev && npm run db:deploy && npm run build && npm prune --omit=dev --omit=peer
    startCommand: npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: SOCIAL_AUTH_MOCK
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: MAIL_TRANSPORT
        value: log
      - key: MAIL_FROM
        value: Ripptopia <no-reply@ripptopia.local>

name: ripptopia

services:
  postgres:
    image: postgres:17-alpine
    container_name: ripptopia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ripptopia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ripptopia}
      POSTGRES_DB: ${POSTGRES_DB:-ripptopia}
    ports:
      - '${POSTGRES_PORT:-5440}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # only runs when the volume is first created
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

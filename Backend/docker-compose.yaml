name: ripptopia

services:
  mongo:
    image: mongo:8.0
    container_name: ripptopia-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "try { quit(rs.status().ok ? 0 : 1) } catch (e) { quit(rs.initiate({_id:''rs0'',members:[{_id:0,host:''localhost:27017''}]}).ok ? 0 : 1) }"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
